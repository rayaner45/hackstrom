<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a1a">
  <title>404 — الصفحة غير موجودة | HACKSTROM</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <style>
    :root{
      --purple:#8b3dff; --cyan:#00d4ff; --bg:#07070f;
      --text:#f2f2ff; --muted:#8a8ab0;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{
      display:grid; place-items:center; overflow:hidden;
      background:var(--bg); color:var(--text);
      font-family:"Segoe UI","Cairo",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    }
    .bg{position:fixed;inset:0;z-index:0;pointer-events:none}
    .bg::before{
      content:""; position:absolute; inset:-20%;
      background:
        radial-gradient(45% 45% at 20% 15%, rgba(139,61,255,.35), transparent 70%),
        radial-gradient(40% 40% at 82% 85%, rgba(0,212,255,.28), transparent 70%);
      filter:blur(10px);
    }
    .bg::after{
      content:""; position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(139,61,255,.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139,61,255,.07) 1px, transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(circle at 50% 45%, #000 20%, transparent 78%);
      -webkit-mask-image:radial-gradient(circle at 50% 45%, #000 20%, transparent 78%);
    }
    .card{
      position:relative; z-index:1; text-align:center;
      padding:2.4rem 2rem; max-width:520px; width:calc(100% - 2rem);
      border-radius:22px;
      background:rgba(12,12,26,.72);
      border:1px solid rgba(139,61,255,.28);
      box-shadow:0 30px 90px -35px rgba(139,61,255,.75), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }
    .badge{
      display:inline-flex; align-items:center; gap:.5rem;
      font-size:.66rem; letter-spacing:.34em; text-transform:uppercase;
      color:var(--muted); border:1px solid rgba(139,61,255,.35);
      padding:.4rem .8rem; border-radius:999px; margin-bottom:1.4rem;
    }
    .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
    .code{
      font-family:"Chakra Petch","Orbitron",ui-monospace,SFMono-Regular,Menlo,monospace;
      font-weight:800; font-size:clamp(4.2rem,18vw,7.5rem); line-height:.9;
      background:linear-gradient(135deg,var(--purple),var(--cyan));
      -webkit-background-clip:text; background-clip:text; color:transparent;
      filter:drop-shadow(0 0 26px rgba(139,61,255,.55));
    }
    h1{font-size:1.15rem; margin:1.1rem 0 .35rem; letter-spacing:.04em}
    .en{font-size:.78rem; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
    p{margin:1.2rem auto 0; font-size:.9rem; line-height:1.8; color:var(--muted); max-width:38ch}
    .actions{display:flex; gap:.7rem; justify-content:center; flex-wrap:wrap; margin-top:1.8rem}
    a.btn{
      text-decoration:none; font-weight:800; font-size:.86rem;
      padding:.78rem 1.4rem; border-radius:12px; transition:.22s;
      display:inline-flex; align-items:center; gap:.5rem;
    }
    a.primary{
      color:#fff;
      background:linear-gradient(135deg,var(--purple),var(--cyan));
      box-shadow:0 14px 40px -16px rgba(139,61,255,.95);
    }
    a.ghost{color:var(--text); border:1px solid rgba(139,61,255,.4); background:rgba(139,61,255,.08)}
    a.btn:hover{transform:translateY(-2px)}
    .foot{margin-top:1.6rem; font-size:.68rem; letter-spacing:.18em; color:#565677}
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <main class="card">
    <span class="badge"><span class="dot"></span> HACKSTROM SECURITY</span>
    <div class="code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <div class="en">Page Not Found</div>
    <p>
      الرابط الذي طلبته غير موجود أو تم نقله. المسار مرفوض من الخادم.
      <br>
      The requested path does not exist and was rejected by the server.
    </p>
    <div class="actions">
      <a class="btn primary" href="/">🏠 الرئيسية / Home</a>
      <a class="btn ghost" href="/#contact">✉️ تواصل / Contact</a>
    </div>
    <div class="foot">HTTPS://HACKSTROM.PAGES.DEV</div>
  </main>
</body>
</html>
